---
kind: pipeline
type: kubernetes
name: default

platform:
  os: linux
  arch: amd64

steps:
  - name: build-image
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/dind
    commands:
      - /usr/local/bin/wait
      - docker build --no-cache -t acp-opensearch-alias-exporter:latest .
    when:
      event:
        - push
        - pull_request
        - tag


  - name: trivy_sast
    pull: Always
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/trivy/client:latest
    resources:
      limits:
        cpu: 1000
        memory: 1024Mi
    environment:
      IMAGE_NAME: acp-opensearch-alias-exporter:latest
      IGNORE_UNFIXED: "true"
      FAIL_ON_DETECTION: "true"
    when:
      event:
        - push      
        - pull_request

  # - name: scan
  #   image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/anchore-submission:latest
  #   pull: always
  #   environment:
  #     IMAGE_NAME: acp-opensearch-alias-exporter:latest
  #     TOLERATE: low
  #   depends_on:
  #     - build-image
  #   when:
  #     event:
  #       - push
  #       - pull_request

  - name: push_to_quay
    image: plugins/docker
    settings:
      registry: quay.io
      repo: quay.io/ukhomeofficedigital/acp-opensearch-alias-exporter
      tags: ${DRONE_TAG}
    environment:
      DOCKER_PASSWORD:
        from_secret: QUAY_TOKEN
      DOCKER_USERNAME: ukhomeofficedigital+acp_opensearch_alias_exporter
    when:
      branch:
        - main
      event:
        - tag

services:
  - name: docker
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/dind

